<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerLens</title>
    <script>
      try {
        let stored = null
        try {
          stored = JSON.parse(
            localStorage.getItem("careerlens-shell") || "null",
          )
        } catch {}
        const persistedTheme = stored?.state?.theme
        const legacyTheme = localStorage.getItem("careerlens-theme")
        const theme = ["light", "dark", "system"].includes(persistedTheme)
          ? persistedTheme
          : legacyTheme
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
