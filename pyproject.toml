[project]
name = "careerlens"
version = "0.1.0"
description = "CareerLens"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.6.2,<2",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn>=0.52.1,<1",
    "workos==9.0.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    "django-stubs[compatible-mypy]>=6.0.7,<7",
    "ruff>=0.14.3,<1",
]
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-django>=4.12.0,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "TID", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy", "mypy_django_plugin.main"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.django"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.django"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
