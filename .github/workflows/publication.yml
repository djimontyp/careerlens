name: Publication
run-name: Publication check · ${{ github.ref_name }}

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify publication boundaries
        run: bash scripts/verify_publication.sh
